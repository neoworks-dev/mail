<!DOCTYPE html>
<!-- An empty cell with a height attribute is a spacer and keeps its height (NordVPN, Consors). -->
<body style="margin:0;background:#eee">
<div style="width:400px;background:#fff">
  <p style="margin:0">Above a 32px spacer.</p>
  <table style="border-collapse:collapse;border-spacing:0;width:100%"><tbody><tr>
    <td height="32" style="font-size:32px;line-height:32px;padding:0;background:#fdd"></td>
  </tr></tbody></table>
  <p style="margin:0">Above a 40px spacer with a non-breaking space.</p>
  <table style="width:100%" cellpadding="0" cellspacing="0"><tr><td height="40" style="font-size:1px;line-height:1px;background:#dfd">&nbsp;</td></tr></table>
  <p style="margin:0">Above a style height spacer.</p>
  <table style="width:100%" cellpadding="0" cellspacing="0"><tr><td style="height:24px;background:#ddf"></td></tr></table>
  <p style="margin:0">End.</p>
</div>
</body>
