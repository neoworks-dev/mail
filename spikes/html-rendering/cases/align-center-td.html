<!-- <td align="center"> centres block children such as a fixed-width table, not just text. -->
<body style="margin:0;background:#eee">
<table width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
  <table style="width:400px;background:#fff"><tr><td style="text-align:left">A 400px table that should sit in the middle.</td></tr></table>
  <div style="width:300px;background:#cde">A 300px div, also centred.</div>
  <p style="text-align:left;width:300px;background:#dec">A paragraph with its own text-align: still centred as a box.</p>
</td></tr></table>
<div align="center"><table style="width:200px;background:#fcc"><tr><td>div align</td></tr></table></div>
<center><table style="width:200px;background:#cfc"><tr><td>center tag</td></tr></table></center>
</body>
