<!DOCTYPE html>
<!-- Cells centre their content vertically by default, block content included. -->
<body style="margin:0;background:#eee">
<table style="width:600px;background:#fff" cellpadding="0" cellspacing="0"><tr>
  <td style="height:80px;background:#fdd">tall cell</td>
  <td style="background:#dfd">inline text</td>
  <td style="background:#ddf"><h3 style="margin:0">block h3</h3></td>
  <td style="background:#ffd"><div>block div</div></td>
  <td valign="top" style="background:#dff">valign top</td>
</tr></table>
</body>
