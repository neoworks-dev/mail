<!DOCTYPE html>
<!-- A width:100%, max-width:640px div with auto margins holding centred 640px tables (FlixBus). -->
<style>table { border-spacing: 0; margin: 0px !important; } div { box-sizing: border-box; }</style>
<body style="margin:0;background:#eee">
<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff"><tr><td align="center" valign="top" style="padding:24px 0">
  <div style="width:100%;max-width:640px;margin:0 auto;font-size:0px;border:1px solid #c8c8c8;border-radius:6px;overflow:hidden">
    <table border="0" width="100%" cellpadding="0" cellspacing="0" style="width:640px;max-width:640px" align="center">
      <tr><td style="padding:0 24px;background:#fde;font-size:16px">Row one, inside a 640px table.</td></tr>
    </table>
    <table border="0" width="100%" cellpadding="0" cellspacing="0" style="width:640px;max-width:640px" align="center">
      <tr><td style="padding:0 24px;background:#dfe;font-size:16px">Row two.</td></tr>
    </table>
  </div>
</td></tr></table>
</body>
