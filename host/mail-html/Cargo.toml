[package]
name = "mail-html"
version = "0.1.0"
edition = "2021"
description = "Lays out HTML mail with litehtml into a display list a native painter draws."
publish = false

[workspace]

[dependencies]
litehtml = { version = "0.2.6", default-features = false, features = ["vendored"] }

[patch.crates-io]
# litehtml with our layout fixes; see host/vendor/litehtml-sys/PATCHES.md.
litehtml-sys = { path = "../vendor/litehtml-sys" }
