<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Neomail</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- img-src includes http(s) because srcdoc frames INHERIT this policy —
		     the per-message opt-in CSP inside MessageBodyFrame is the actual
		     remote-image gate, and stays img-src data: cid: until the user
		     allows loading. App-side markdown strips <img> (see renderMarkdown). -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self' neomail-nib:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self' neomail-nib:; frame-src 'self' data: about:"
		/>
	</head>
	<body class="bg-canvas text-default">
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
